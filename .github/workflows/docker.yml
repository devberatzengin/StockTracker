name: docker

# Builds the images to make sure the Dockerfiles stay valid. A version tag (v1.0.0) also pushes
# them to GitHub Container Registry as ghcr.io/<owner>/stocktracker-<name>:1.0.0 and :latest.
on:
  push:
    branches: [main]
    # No paths filter on push: it would also apply to tag pushes and could skip a release.
    tags: ["v*"]
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/docker.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            file: backend/Dockerfile
          - name: migrator
            context: backend
            file: backend/Dockerfile.migrator
          - name: web
            context: frontend
            file: frontend/Dockerfile
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stocktracker-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
