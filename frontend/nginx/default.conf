# Keep the original scheme when behind cloudflared (HTTPS); fall back to our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Client IP for the API's login rate limit: Cloudflare sets CF-Connecting-IP at its edge, so behind
# cloudflared it is the visitor; without the tunnel it is the direct peer. Publish the web port only
# on 127.0.0.1 in production so nobody can send this header past the tunnel.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Uploads (photos, Phase 3) go through the API.
    client_max_body_size 6m;

    location /api/ {
        # No URI on proxy_pass: the /api prefix is kept.
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        # Replaced, not appended: the API trusts one proxy hop and reads the last address.
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Vite emits content-hashed file names; safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are client-side routes.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
