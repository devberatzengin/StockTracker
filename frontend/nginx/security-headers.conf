# Security headers (PLAN 4.3). Included at server level and again in every location that sets its
# own add_header, because nginx drops inherited add_header directives in such locations.
#
# style-src 'unsafe-inline': Mantine writes inline style attributes and CSS variables.
# img-src https:: product photos may come from presigned R2 URLs (Storage__Provider=R2).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Camera only for this origin (barcode/QR scanning); everything else off.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
